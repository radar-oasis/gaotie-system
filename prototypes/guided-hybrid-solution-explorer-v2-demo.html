<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>高铁涂装人机共创｜引导式混合方案探索器 V2</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f9;
      --panel: #ffffff;
      --line: #e1e6ee;
      --text: #172033;
      --muted: #667085;
      --primary: #1d4ed8;
      --primary-soft: #eff6ff;
      --human: #d9632f;
      --ai: #2563eb;
      --asset: #7c3aed;
      --layout: #e67e22;
      --palette: #17915d;
      --shadow: 0 12px 34px rgba(30, 41, 59, .09);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; overflow: hidden; background: var(--bg); color: var(--text); font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .46; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 3px solid rgba(37, 99, 235, .28); outline-offset: 2px; }

    .app { display: grid; grid-template-rows: 62px 74px minmax(0, 1fr); height: 100%; min-width: 960px; }
    .topbar { display: flex; align-items: center; gap: 12px; padding: 0 22px; border-bottom: 1px solid var(--line); background: #fff; }
    .brand { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 10px; background: #182337; color: #fff; font-weight: 800; }
    .brand-copy strong { display: block; font-size: 14px; }
    .brand-copy span { display: block; margin-top: 2px; color: var(--muted); font-size: 10px; }
    .topbar-spacer { flex: 1; }
    .context-pill { padding: 6px 10px; border-radius: 999px; background: #f6f8fb; color: #475467; font-size: 10px; font-weight: 700; }
    .top-action { min-height: 34px; padding: 0 12px; border: 1px solid var(--line); border-radius: 9px; background: #fff; color: #475467; font-size: 11px; font-weight: 700; }

    .stagebar { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; padding: 10px 20px; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.96); }
    .stage-tab { display: grid; grid-template-columns: 30px 1fr; align-items: center; gap: 8px; min-width: 0; padding: 7px 9px; border: 1px solid transparent; border-radius: 11px; background: transparent; color: #667085; text-align: left; }
    .stage-tab.is-active { border-color: #bfd4fc; background: var(--primary-soft); color: #1d4ed8; }
    .stage-index { width: 29px; height: 29px; display: grid; place-items: center; border-radius: 8px; background: #eef2f7; font-size: 10px; font-weight: 800; }
    .stage-tab.is-active .stage-index { background: var(--primary); color: #fff; }
    .stage-copy { min-width: 0; }
    .stage-copy strong { display: block; overflow: hidden; font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .stage-copy span { display: block; margin-top: 2px; overflow: hidden; color: #98a2b3; font-size: 8px; text-overflow: ellipsis; white-space: nowrap; }

    .workspace { min-height: 0; overflow: hidden; }
    .demand-view { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(320px, .8fr); height: 100%; }
    .chat-panel { display: grid; grid-template-rows: 68px minmax(0, 1fr) auto; min-width: 0; border-right: 1px solid var(--line); background: #fbfcfe; }
    .module-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 24px; border-bottom: 1px solid var(--line); background: #fff; }
    .module-header h1 { margin: 0; font-size: 17px; }
    .module-header p { margin: 4px 0 0; color: var(--muted); font-size: 10px; }
    .module-badge { padding: 5px 8px; border-radius: 999px; background: #edf4ff; color: #1d4ed8; font-size: 9px; font-weight: 750; }
    .chat-stream { overflow: auto; padding: 26px clamp(28px, 7vw, 90px); }
    .message { display: flex; gap: 10px; max-width: 720px; margin-bottom: 20px; }
    .message.user { margin-left: auto; flex-direction: row-reverse; }
    .avatar { flex: 0 0 30px; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 9px; background: #182337; color: #fff; font-size: 10px; font-weight: 800; }
    .message.user .avatar { background: #d9632f; }
    .bubble { padding: 13px 15px; border: 1px solid var(--line); border-radius: 14px; background: #fff; box-shadow: 0 3px 12px rgba(30,41,59,.04); font-size: 12px; line-height: 1.75; }
    .message.user .bubble { border-color: #f3cdbd; background: #fff6f1; }
    .chat-input { display: flex; gap: 9px; margin: 0 clamp(28px, 7vw, 90px) 24px; padding: 9px; border: 1px solid #ccd5e3; border-radius: 13px; background: #fff; box-shadow: var(--shadow); }
    .chat-input input { flex: 1; min-width: 0; border: 0; outline: 0; color: #344054; font-size: 11px; }
    .primary-button { min-height: 38px; padding: 0 15px; border: 1px solid var(--primary); border-radius: 9px; background: var(--primary); color: #fff; font-size: 11px; font-weight: 750; }
    .secondary-button { min-height: 36px; padding: 0 12px; border: 1px solid var(--line); border-radius: 9px; background: #fff; color: #475467; font-size: 10px; font-weight: 700; }

    .intent-panel { display: grid; grid-template-rows: 68px minmax(0, 1fr) auto; min-width: 0; background: #fff; }
    .intent-content { overflow: auto; padding: 20px; }
    .summary-card { padding: 15px; border: 1px solid var(--line); border-radius: 13px; background: #f8fafc; }
    .summary-card strong { display: block; margin-bottom: 7px; font-size: 12px; }
    .summary-card p { margin: 0; color: var(--muted); font-size: 10px; line-height: 1.7; }
    .section-title { margin: 20px 0 10px; font-size: 11px; }
    .intent-grid { display: flex; flex-wrap: wrap; gap: 8px; }
    .intent-chip { min-height: 34px; padding: 0 11px; border: 1px solid var(--line); border-radius: 999px; background: #fff; color: #475467; font-size: 10px; }
    .intent-chip.is-selected { border-color: #e99b78; background: #fff4ed; color: #b54708; }
    .intent-footer { padding: 16px 20px; border-top: 1px solid var(--line); background: #fff; }
    .intent-footer .primary-button { width: 100%; }
    .recommend-view { display: grid; grid-template-columns: 280px minmax(0, 1fr) 300px; height: 100%; background: #fff; }
    .recommend-side { display: grid; grid-template-rows: 68px minmax(0, 1fr) auto; min-width: 0; border-right: 1px solid var(--line); background: #fbfcfe; }
    .recommend-side.right { border-right: 0; border-left: 1px solid var(--line); }
    .recommend-side-content { overflow: auto; padding: 17px; }
    .filter-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .filter-tag { padding: 5px 8px; border-radius: 999px; background: #eef3f9; color: #475467; font-size: 8px; }
    .recommend-main { display: grid; grid-template-rows: 68px minmax(0, 1fr); min-width: 0; }
    .recommend-grid { display: grid; grid-template-columns: repeat(3, minmax(170px, 1fr)); gap: 13px; overflow: auto; padding: 18px; align-content: start; background: #fff; }
    .pattern-card { overflow: hidden; border: 1px solid var(--line); border-radius: 13px; background: #fff; transition: border-color .16s ease, box-shadow .16s ease; }
    .pattern-card.is-selected { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,.1); }
    .pattern-image { height: 126px; display: grid; place-items: center; background: #f5f5f2; }
    .pattern-image svg { width: 100%; height: 100%; }
    .pattern-copy { padding: 11px; }
    .pattern-copy strong { display: block; font-size: 11px; }
    .pattern-copy p { min-height: 31px; margin: 5px 0 8px; color: var(--muted); font-size: 8px; line-height: 1.55; }
    .style-label { display: inline-flex; padding: 3px 6px; border-radius: 999px; background: #f2f4f7; color: #667085; font-size: 7px; }
    .pattern-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-top: 9px; }
    .pattern-actions button { min-height: 27px; border: 1px solid var(--line); border-radius: 7px; background: #fff; color: #475467; font-size: 8px; }
    .pattern-actions .select-pattern { grid-column: 1 / -1; border-color: #bfd4fc; color: #1d4ed8; }
    .pattern-actions button.is-active { border-color: var(--primary); background: var(--primary-soft); color: var(--primary); }
    .selected-pattern-row { display: grid; grid-template-columns: 64px 1fr; gap: 9px; align-items: center; margin-bottom: 8px; padding: 8px; border: 1px solid var(--line); border-radius: 9px; background: #fff; }
    .selected-pattern-row svg { width: 64px; height: 46px; border-radius: 6px; background: #f4f5f2; }
    .selected-pattern-row strong { font-size: 9px; }
    .preference-box { margin-top: 12px; padding: 11px; border: 1px solid #cfe0fb; border-radius: 10px; background: #f5f8ff; }
    .preference-box strong { display: block; margin-bottom: 5px; color: #1d4ed8; font-size: 10px; }
    .preference-box p { margin: 0; color: #475467; font-size: 8px; line-height: 1.55; }
    .side-footer { padding: 14px 17px; border-top: 1px solid var(--line); background: #fff; }
    .side-footer .primary-button, .side-footer .secondary-button { width: 100%; }
    .transform-view { display: grid; grid-template-columns: 270px minmax(620px, 1fr) 290px; height: 100%; background: #fff; }
    .canvas-side { display: grid; grid-template-rows: 68px minmax(0, 1fr) auto; min-width: 0; background: #fbfcfe; border-right: 1px solid var(--line); }
    .canvas-side.right { border-right: 0; border-left: 1px solid var(--line); }
    .asset-scroll { overflow: auto; padding: 14px; }
    .asset-card { margin-bottom: 9px; padding: 8px; border: 1px solid var(--line); border-radius: 10px; background: #fff; cursor: pointer; }
    .asset-card.is-selected { border-color: var(--primary); background: var(--primary-soft); }
    .asset-card svg { width: 100%; height: 72px; display: block; border-radius: 7px; background: #f3f4f0; }
    .asset-card strong { display: block; margin: 6px 0 3px; font-size: 9px; }
    .asset-card span { color: var(--muted); font-size: 8px; }
    .canvas-main { display: grid; grid-template-rows: 50px minmax(0, 1fr) auto; min-width: 0; background: #eef2f7; }
    .canvas-toolbar { display: flex; align-items: center; gap: 6px; padding: 0 12px; border-bottom: 1px solid var(--line); background: #fff; }
    .tool-button { min-width: 34px; min-height: 32px; padding: 0 9px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: #475467; font-size: 9px; }
    .tool-button.is-active { border-color: var(--primary); background: var(--primary-soft); color: var(--primary); }
    .canvas-stage { position: relative; overflow: auto; display: grid; place-items: center; padding: 28px; background-color: #edf1f6; background-image: radial-gradient(#c4cedb .8px, transparent .8px); background-size: 20px 20px; }
    .train-board { position: relative; width: min(760px, 94%); aspect-ratio: 640 / 230; border: 1px solid #cbd5e1; border-radius: 14px; background: #fff; box-shadow: 0 18px 50px rgba(30,41,59,.12); user-select: none; }
    .train-board svg { display: block; width: 100%; height: 100%; }
    .drag-hint { position: absolute; left: 14px; bottom: 11px; padding: 5px 8px; border-radius: 7px; background: rgba(255,255,255,.86); color: #667085; font-size: 8px; }
    .transform-controls { padding: 12px 15px; border-top: 1px solid var(--line); background: #fff; }
    .prompt-branches { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
    .prompt-branch { padding: 8px; border: 1px solid var(--line); border-radius: 9px; background: #fafbfc; }
    .prompt-branch strong { display: block; color: #344054; font-size: 9px; }
    .prompt-branch p { margin: 3px 0 0; color: var(--muted); font-size: 7px; line-height: 1.45; }
    .control-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    .range-label { display: grid; grid-template-columns: 60px 1fr 36px; align-items: center; gap: 6px; color: #667085; font-size: 8px; }
    .range-label input { width: 100%; accent-color: var(--primary); }
    .range-label output { color: #344054; font-weight: 750; text-align: right; }
    .capture-card { margin-bottom: 9px; overflow: hidden; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
    .capture-card svg { display: block; width: 100%; height: 92px; background: #f6f8fa; }
    .capture-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px; }
    .capture-meta strong { font-size: 9px; }
    .capture-meta span { color: var(--muted); font-size: 7px; }
    .compose-view { display: grid; grid-template-columns: 255px minmax(620px, 1fr) 310px; height: 100%; background: #fff; }
    .node-side { display: grid; grid-template-rows: 68px minmax(0, 1fr) auto; min-width: 0; border-right: 1px solid var(--line); background: #fbfcfe; }
    .node-side.right { border-right: 0; border-left: 1px solid var(--line); }
    .library-scroll, .inspector-scroll { overflow: auto; padding: 15px; }
    .library-note { margin-bottom: 12px; padding: 10px; border: 1px solid #cfe0fb; border-radius: 10px; background: #f4f8ff; color: #475467; font-size: 8px; line-height: 1.6; }
    .node-tool { width: 100%; display: grid; grid-template-columns: 34px 1fr 22px; align-items: center; gap: 9px; margin-bottom: 8px; padding: 9px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: #344054; text-align: left; }
    .node-tool:hover { border-color: #a8b9d4; }
    .node-tool-icon { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 9px; background: #f0f4fa; font-weight: 850; }
    .node-tool strong { display: block; font-size: 10px; }
    .node-tool span:not(.node-tool-icon) { display: block; margin-top: 2px; color: var(--muted); font-size: 7px; line-height: 1.45; }
    .node-tool b { color: #98a2b3; font-size: 16px; text-align: center; }
    .node-tool[data-add-node="capture"] .node-tool-icon { background: #f2ecff; color: var(--asset); }
    .node-tool[data-add-node="layout"] .node-tool-icon { background: #fff2e8; color: var(--layout); }
    .node-tool[data-add-node="palette"] .node-tool-icon { background: #eaf8f1; color: var(--palette); }
    .node-tool[data-add-node="generator"] .node-tool-icon { background: #eaf2ff; color: var(--ai); }
    .node-workbench { display: grid; grid-template-rows: 50px minmax(0, 1fr); min-width: 0; background: #eef2f7; }
    .node-toolbar { display: flex; align-items: center; gap: 7px; padding: 0 12px; border-bottom: 1px solid var(--line); background: #fff; }
    .node-toolbar p { margin: 0; color: #667085; font-size: 8px; }
    .node-toolbar p strong { color: #344054; }
    .node-canvas { position: relative; min-width: 760px; min-height: 560px; overflow: auto; background-color: #f2f5f9; background-image: linear-gradient(#e2e8f0 1px, transparent 1px), linear-gradient(90deg, #e2e8f0 1px, transparent 1px); background-size: 22px 22px; }
    .edge-layer { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
    .edge-line { fill: none; stroke-width: 2.4; pointer-events: stroke; cursor: pointer; }
    .edge-line.capture { stroke: var(--asset); }
    .edge-line.layout { stroke: var(--layout); }
    .edge-line.palette { stroke: var(--palette); }
    .explorer-node { position: absolute; z-index: 2; width: 190px; min-height: 104px; padding: 11px; border: 1px solid #cfd8e6; border-radius: 12px; background: #fff; box-shadow: 0 8px 24px rgba(30,41,59,.1); cursor: grab; user-select: none; }
    .explorer-node.is-selected { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,.12), 0 10px 30px rgba(30,41,59,.12); }
    .explorer-node[data-node-type="capture"] { border-top: 4px solid var(--asset); }
    .explorer-node[data-node-type="layout"] { border-top: 4px solid var(--layout); }
    .explorer-node[data-node-type="palette"] { border-top: 4px solid var(--palette); }
    .explorer-node[data-node-type="generator"] { width: 220px; border-top: 4px solid var(--ai); }
    .node-head { display: flex; align-items: center; gap: 7px; }
    .node-head span { width: 24px; height: 24px; display: grid; place-items: center; border-radius: 7px; background: #f2f4f7; font-size: 9px; font-weight: 850; }
    .node-head strong { font-size: 10px; }
    .node-summary { margin: 8px 0 0; color: var(--muted); font-size: 8px; line-height: 1.55; }
    .node-status { display: inline-flex; margin-top: 8px; padding: 3px 6px; border-radius: 999px; background: #f2f4f7; color: #667085; font-size: 7px; }
    .node-status.is-ready { background: #e8f7ef; color: #087443; }
    .node-port { position: absolute; top: 48px; width: 13px; height: 13px; padding: 0; border: 2px solid #fff; border-radius: 50%; box-shadow: 0 0 0 1px #94a3b8; background: #94a3b8; }
    .node-port.output { right: -7px; }
    .node-port.input { left: -7px; }
    .node-port.capture { background: var(--asset); }
    .node-port.layout { top: 69px; background: var(--layout); }
    .node-port.palette { top: 90px; background: var(--palette); }
    .inspector-title { margin: 0 0 10px; font-size: 12px; }
    .inspector-card { margin-bottom: 10px; padding: 11px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
    .inspector-card strong { display: block; margin-bottom: 6px; font-size: 9px; }
    .inspector-card p { margin: 0; color: var(--muted); font-size: 8px; line-height: 1.6; }
    .input-check { display: flex; justify-content: space-between; gap: 8px; margin-top: 6px; font-size: 8px; }
    .input-check b { color: #087443; }
    .input-check b.missing { color: #b54708; }
    .edge-selection { padding: 11px; border: 1px solid #f2c9ac; border-radius: 10px; background: #fff8f2; }
    .edge-selection strong { display: block; font-size: 10px; }
    .edge-selection p { margin: 6px 0 10px; color: #667085; font-size: 8px; line-height: 1.55; }
    .danger-button { width: 100%; min-height: 34px; border: 1px solid #e9a594; border-radius: 8px; background: #fff; color: #b42318; font-size: 9px; font-weight: 750; }
    .moodboard-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 8px 0 10px; }
    .moodboard-image { height: 62px; overflow: hidden; border-radius: 7px; border: 1px solid var(--line); }
    .moodboard-image:nth-child(1) { background: linear-gradient(145deg, #9d2727 0 55%, #d8b986 56% 62%, #3c2521 63%); }
    .moodboard-image:nth-child(2) { background: radial-gradient(circle at 30% 28%, #f4f0e7 0 13%, transparent 14%), repeating-radial-gradient(circle at 70% 60%, #285a9b 0 7px, #f4f0e7 8px 13px); }
    .moodboard-image:nth-child(3) { background: linear-gradient(165deg, #dbe2e5 0 34%, #8295a2 35% 41%, #f6f2e9 42% 58%, #253d55 59% 64%, #b9a47a 65%); }
    .swatch-row { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 8px; }
    .swatch { position: relative; width: 43px; height: 43px; border: 2px solid #fff; border-radius: 9px; box-shadow: 0 0 0 1px #cfd8e6; }
    .swatch small { position: absolute; left: 50%; bottom: -14px; transform: translateX(-50%); color: #667085; font-size: 6px; white-space: nowrap; }
    .swatch-remove { position: absolute; right: -5px; top: -5px; width: 16px; height: 16px; padding: 0; border: 0; border-radius: 50%; background: #b42318; color: #fff; font-size: 10px; line-height: 1; }
    .layout-option { width: 100%; margin-top: 7px; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: #475467; text-align: left; font-size: 8px; }
    .layout-option.is-selected { border-color: var(--layout); background: #fff8f1; color: #9a4c0b; }
    .connection-hint { margin-left: 10px; padding: 5px 8px; border-radius: 999px; background: #fff4e8; color: #9a4c0b; font-size: 8px; font-weight: 700; }
    .prompt-packet { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
    .prompt-images { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-top: 7px; }
    .prompt-image { height: 58px; overflow: hidden; border: 1px solid var(--line); border-radius: 7px; background: #f6f8fa; }
    .prompt-image svg { display: block; width: 100%; height: 100%; }
    .layout-mini { height: 100%; padding: 8px; background: #fff8f1; }
    .layout-mini span { display: block; height: 5px; margin: 7px 0; border-radius: 999px; background: #e67e22; }
    .layout-mini span:nth-child(2) { width: 72%; opacity: .45; }
    .palette-mini { display: grid; grid-template-columns: repeat(2, 1fr); height: 100%; }
    .composed-prompt { max-height: 118px; overflow: auto; margin-top: 8px; padding: 8px; border-radius: 8px; background: #f7f8fa; color: #475467; font-size: 7px; line-height: 1.55; white-space: pre-wrap; }
    .button-stack { display: grid; gap: 7px; margin-top: 10px; }
    .select-view { display: grid; grid-template-rows: 74px minmax(0, 1fr) auto; height: 100%; background: #f6f8fb; }
    .select-header, .fidelity-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 22px; border-bottom: 1px solid var(--line); background: #fff; }
    .select-header h1, .fidelity-header h1 { margin: 0; font-size: 17px; }
    .select-header p, .fidelity-header p { margin: 4px 0 0; color: var(--muted); font-size: 9px; }
    .selection-count { padding: 7px 10px; border-radius: 999px; background: var(--primary-soft); color: var(--primary); font-size: 9px; font-weight: 750; }
    .select-content { display: grid; grid-template-columns: minmax(0, 1fr) 300px; min-height: 0; }
    .proposal-grid { display: grid; grid-template-columns: repeat(3, minmax(220px, 1fr)); gap: 14px; overflow: auto; padding: 18px; align-content: start; }
    .proposal-card { overflow: hidden; border: 1px solid var(--line); border-radius: 13px; background: #fff; box-shadow: 0 5px 18px rgba(30,41,59,.06); }
    .proposal-card.is-selected { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
    .proposal-preview { height: 155px; background: #eef2f6; }
    .proposal-preview svg { display: block; width: 100%; height: 100%; }
    .proposal-info { padding: 12px; }
    .proposal-title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .proposal-title-row strong { font-size: 11px; }
    .recommended-tag { padding: 3px 6px; border-radius: 999px; background: #e8f7ef; color: #087443; font-size: 7px; font-weight: 750; }
    .proposal-route { margin: 7px 0; color: #667085; font-size: 8px; line-height: 1.5; }
    .score-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin: 9px 0; }
    .score-cell { padding: 6px; border-radius: 7px; background: #f7f8fa; text-align: center; }
    .score-cell b { display: block; color: #344054; font-size: 10px; }
    .score-cell span { color: #98a2b3; font-size: 6px; }
    .select-button { width: 100%; min-height: 32px; border: 1px solid #bfd4fc; border-radius: 8px; background: #fff; color: var(--primary); font-size: 9px; font-weight: 750; }
    .proposal-card.is-selected .select-button { background: var(--primary); color: #fff; }
    .ai-evaluation { overflow: auto; padding: 18px; border-left: 1px solid var(--line); background: #fff; }
    .ai-evaluation h2 { margin: 0 0 12px; font-size: 13px; }
    .evaluation-card { margin-bottom: 10px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: #fafbfc; }
    .evaluation-card strong { display: block; margin-bottom: 6px; color: #344054; font-size: 9px; }
    .evaluation-card p { margin: 0; color: #667085; font-size: 8px; line-height: 1.65; }
    .select-footer { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 22px; border-top: 1px solid var(--line); background: #fff; }
    .fidelity-view { display: grid; grid-template-rows: 74px minmax(0, 1fr); height: 100%; background: #f6f8fb; }
    .fidelity-content { display: grid; grid-template-columns: 280px minmax(0, 1fr); min-height: 0; }
    .scene-panel { display: grid; grid-template-rows: minmax(0, 1fr) auto; min-height: 0; border-right: 1px solid var(--line); background: #fff; }
    .scene-scroll { overflow: auto; padding: 16px; }
    .scene-scroll h2 { margin: 0 0 5px; font-size: 12px; }
    .scene-scroll > p { margin: 0 0 13px; color: var(--muted); font-size: 8px; line-height: 1.5; }
    .scene-option { width: 100%; display: grid; grid-template-columns: 50px 1fr; gap: 9px; align-items: center; margin-bottom: 8px; padding: 8px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: #475467; text-align: left; }
    .scene-option.is-selected { border-color: var(--primary); background: var(--primary-soft); color: var(--primary); }
    .scene-thumb { height: 40px; border-radius: 7px; background: linear-gradient(160deg, #cbd5e1, #f8fafc 45%, #8fa3b8 46%, #45586c); }
    .scene-option strong { display: block; font-size: 9px; }
    .scene-option span { display: block; margin-top: 3px; color: #667085; font-size: 7px; }
    .output-area { overflow: auto; padding: 18px; }
    .output-empty { max-width: 480px; margin: 90px auto; padding: 25px; border: 1px dashed #b9c4d2; border-radius: 14px; background: #fff; text-align: center; }
    .output-empty strong { display: block; font-size: 12px; }
    .output-empty p { color: var(--muted); font-size: 9px; line-height: 1.6; }
    .output-grid { display: grid; grid-template-columns: repeat(2, minmax(300px, 1fr)); gap: 14px; }
    .output-card { overflow: hidden; border: 1px solid var(--line); border-radius: 13px; background: #fff; box-shadow: 0 7px 24px rgba(30,41,59,.07); }
    .output-visual { height: 205px; }
    .output-visual svg { display: block; width: 100%; height: 100%; }
    .output-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px; }
    .output-meta strong { font-size: 10px; }
    .output-meta span { color: #667085; font-size: 7px; }
    .modal-backdrop { position: fixed; z-index: 20; inset: 0; display: flex; justify-content: flex-end; background: rgba(15,23,42,.38); }
    .archive-drawer { width: min(430px, 92vw); height: 100%; display: grid; grid-template-rows: 72px minmax(0, 1fr); background: #fff; box-shadow: -18px 0 48px rgba(15,23,42,.2); }
    .archive-body { overflow: auto; padding: 18px; }
    .archive-step { position: relative; margin-left: 10px; padding: 0 0 19px 22px; border-left: 2px solid #dbe4ef; }
    .archive-step::before { content: ""; position: absolute; left: -6px; top: 1px; width: 10px; height: 10px; border-radius: 50%; background: var(--primary); }
    .archive-step strong { font-size: 10px; }
    .archive-step p { margin: 4px 0 0; color: #667085; font-size: 8px; line-height: 1.55; }
    .placeholder-view { height: 100%; display: grid; place-items: center; color: var(--muted); }

    @media (max-width: 1100px) {
      body { overflow: auto; }
      .app { min-height: 760px; }
      .stage-copy span { display: none; }
      .demand-view { grid-template-columns: minmax(560px, 1fr) 330px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <div class="app" data-app="hybrid-explorer-v2">
    <header class="topbar">
      <div class="brand">轨</div>
      <div class="brand-copy"><strong>文化主题高铁涂装共创系统</strong><span>引导式混合方案探索器 · V2 演示</span></div>
      <div class="topbar-spacer"></div>
      <span class="context-pill">CR400BF · 中国传统文化</span>
      <button class="top-action" type="button" data-action="open-archive">过程档案</button>
      <button class="top-action" type="button" data-action="reset-demo">重置演示</button>
    </header>
    <nav class="stagebar" data-region="stage-nav" aria-label="设计流程阶段"></nav>
    <main class="workspace" data-region="main-workspace" aria-label="高铁涂装人机共创工作区"></main>
  </div>
  <div data-region="modal-layer"></div>

  <script>
    (() => {
      const INITIAL_STATE = {
        activeStage: 'demand',
        demandConfirmed: false,
        intentions: ['龙纹', '祥云', '宫墙'],
        recommendationRound: 1,
        preferredStyles: [],
        reducedStyles: [],
        selectedPatternIds: [],
        generatedVariants: [],
        selectedVariantId: null,
        motifPlacement: { x: 54, y: 46, scale: 1 },
        captures: [],
        explorerNodes: [],
        explorerEdges: [],
        selectedNodeId: null,
        selectedEdgeId: null,
        pendingConnection: null,
        layoutAssets: [],
        paletteAssets: [],
        proposals: [],
        selectedProposalIds: [],
        selectedSceneIds: [],
        highFidelityOutputs: [],
        archiveOpen: false,
      };
      const clone = (value) => JSON.parse(JSON.stringify(value));
      let state = clone(INITIAL_STATE);
      let draggingMotif = false;
      let draggingNode = null;

      const stages = [
        { id: 'demand', label: '需求分析', hint: '对话与文化意向' },
        { id: 'recommend', label: '纹样推荐', hint: '多风格与偏好反馈' },
        { id: 'transform', label: '纹样转化', hint: '视觉画布与截图' },
        { id: 'compose', label: '方案编排', hint: '节点组合与分支' },
        { id: 'select', label: '方案筛选', hint: 'AI 建议与人工选择' },
        { id: 'fidelity', label: '高保真输出', hint: '场景深化与归档' },
      ];

      function canOpenStage(stageId) {
        if (stageId === 'demand') return true;
        if (stageId === 'recommend') return state.demandConfirmed;
        if (stageId === 'transform') return state.selectedPatternIds.length > 0;
        if (stageId === 'compose') return state.captures.length > 0;
        if (stageId === 'select') return state.proposals.length > 0;
        if (stageId === 'fidelity') return state.selectedProposalIds.length > 0;
        return false;
      }

      function renderStageNav() {
        const region = document.querySelector('[data-region="stage-nav"]');
        region.innerHTML = stages.map((stage, index) => `
          <button class="stage-tab ${state.activeStage === stage.id ? 'is-active' : ''}" type="button" data-stage data-stage-id="${stage.id}" ${canOpenStage(stage.id) ? '' : 'disabled'} ${state.activeStage === stage.id ? 'aria-current="step"' : ''}>
            <span class="stage-index">${index + 1}</span><span class="stage-copy"><strong>${stage.label}</strong><span>${stage.hint}</span></span>
          </button>`).join('');
      }

      function renderDemand() {
        const intentionOptions = ['龙纹', '祥云', '宫墙', '青花', '山水', '速度感'];
        return `<section class="demand-view" data-view="demand">
          <div class="chat-panel">
            <header class="module-header"><div><h1>需求分析与文化主题发散</h1><p>通过对话把宽泛主题收敛为可用于设计的文化意向</p></div><span class="module-badge">原有对话模块</span></header>
            <div class="chat-stream">
              <article class="message user"><span class="avatar">我</span><div class="bubble">我想为 CR400BF 设计一套中国传统文化主题涂装，整体要现代、庄重，同时具有速度感。</div></article>
              <article class="message"><span class="avatar">AI</span><div class="bubble">我建议从“文化身份—视觉意向—车体适配”三个层次展开。可优先探索龙纹、祥云与宫墙朱红，同时用青花蓝或山水灰作为少量现代化点缀。你可以在右侧确认希望进入下一阶段的意向。</div></article>
              <article class="message user"><span class="avatar">我</span><div class="bubble">纹样不要太复杂，需要适合修长车身，并保留较多金属色留白。</div></article>
              <article class="message"><span class="avatar">AI</span><div class="bubble">已记录：降低纹样密度、强调水平延展、保留银白金属底色。后续纹样推荐会同时提供传统、几何、极简和现代融合方向。</div></article>
            </div>
            <div class="chat-input"><input aria-label="补充设计需求" placeholder="继续补充文化主题、气质或车型要求"><button class="primary-button" type="button">发送</button></div>
          </div>
          <aside class="intent-panel">
            <header class="module-header"><div><h1>设计意向清单</h1><p>人工确认后进入纹样推荐</p></div><span class="module-badge">用户决策</span></header>
            <div class="intent-content">
              <div class="summary-card"><strong>当前任务摘要</strong><p>车型：CR400BF 严格侧视白模<br>目标：现代、庄重、具有速度感<br>约束：保留窗门结构与大面积银白留白</p></div>
              <h2 class="section-title">AI 发散的文化意向</h2>
              <div class="intent-grid">${intentionOptions.map((item) => `<button class="intent-chip ${state.intentions.includes(item) ? 'is-selected' : ''}" type="button" data-intent="${item}" aria-pressed="${state.intentions.includes(item)}">${item}</button>`).join('')}</div>
              <h2 class="section-title">共享上下文</h2>
              <div class="summary-card"><p>已选意向会用于多风格纹样推荐、纹样转化提示词、色彩情绪板检索和最终多模态提示词。</p></div>
            </div>
            <footer class="intent-footer"><button class="primary-button" type="button" data-action="confirm-demand" ${state.intentions.length ? '' : 'disabled'}>确认意向，进入纹样推荐</button></footer>
          </aside>
        </section>`;
      }

      function motifSvg(kind) {
        const base = kind.includes('cloud')
          ? `<path d="M18 66c13-25 42-22 50-4 7-31 53-38 65-7 27-17 63 3 54 31H42c-19 0-30-8-24-20Z" fill="none" stroke="#27364a" stroke-width="7" stroke-linecap="round"/><path d="M58 88h91c17 0 25 9 16 20H82" fill="none" stroke="#b8322a" stroke-width="5" stroke-linecap="round"/>`
          : kind.includes('geometric')
            ? `<path d="M18 94 51 44l28 28 30-47 31 52 26-31 38 48-44-13-27 25-30-26-34 31-28-25Z" fill="none" stroke="#27364a" stroke-width="7" stroke-linejoin="round"/><circle cx="54" cy="43" r="8" fill="#b8322a"/>`
            : kind.includes('blue')
              ? `<path d="M12 80c30-55 71-60 104-18 23 29 51 37 96 2" fill="none" stroke="#285a9b" stroke-width="10" stroke-linecap="round"/><path d="M50 64c-4-27 17-41 43-33L82 46l22-2-15 17 22 10-27 5" fill="#285a9b"/>`
              : kind.includes('minimal')
                ? `<path d="M12 85c33-52 75-52 107-17 23 25 49 29 92-5" fill="none" stroke="#b8322a" stroke-width="9" stroke-linecap="round"/><path d="M45 67c-8-28 13-45 42-37l-11 16 25-4-17 19 25 10-29 7" fill="#b8322a"/>`
                : `<path d="M42 105c-20-23-17-59 10-77 23-16 57-9 64 17 7 24-13 37-30 24-13-11 1-31 22-25 37 11 27 64 58 71 20 5 34-13 27-31" fill="none" stroke="#27364a" stroke-width="8" stroke-linecap="round"/><path d="M45 41 17 25l14 28-28 5 34 9M71 27 68 3l18 18L99 2l2 31" fill="none" stroke="#27364a" stroke-width="6"/><circle cx="61" cy="43" r="5" fill="#b8322a"/>`;
        return `<svg viewBox="0 0 220 130" role="img" aria-label="纹样预览">${base}</svg>`;
      }

      const patternCatalog = [
        { id: 'traditional-round-dragon', title: '传统团龙纹', style: '传统线描', note: '文化身份强，细节密度较高' },
        { id: 'traditional-cloud', title: '祥云边饰', style: '传统线描', note: '适合腰线和局部边界点缀' },
        { id: 'geometric-scale', title: '几何龙鳞', style: '几何抽象', note: '模块化秩序，适合重复构成' },
        { id: 'minimal-dragon', title: '单线流线龙形', style: '极简流线', note: '水平延展明显，适合修长车身' },
        { id: 'minimal-cloud', title: '水平云气纹', style: '极简流线', note: '低密度连续节奏，留白充分' },
        { id: 'blue-fusion', title: '青花龙纹', style: '现代融合', note: '青花蓝与传统龙形的现代转译' },
      ];

      function renderRecommendation() {
        const roundReason = state.recommendationRound === 1
          ? '首轮同时覆盖传统、几何、极简和现代融合方向，避免过早收敛。'
          : '根据反馈提高极简流线权重：增加水平延展、降低具象细节，并继续保持龙首可辨。';
        const orderedPatterns = state.recommendationRound === 1
          ? patternCatalog
          : [...patternCatalog].sort((a, b) => Number(b.style === '极简流线') - Number(a.style === '极简流线'));
        return `<section class="recommend-view" data-view="recommend">
          <aside class="recommend-side">
            <header class="module-header"><div><h1>纹样检索条件</h1><p>需求对话自动转为检索上下文</p></div></header>
            <div class="recommend-side-content">
              <div class="summary-card"><strong>检索解析</strong><p>围绕中国传统文化、龙纹与祥云，优先寻找可横向延展、低密度、适合高铁侧车身的视觉母题。</p><div class="filter-row">${state.intentions.map(item => `<span class="filter-tag">${item}</span>`).join('')}</div></div>
              <div class="preference-box"><strong>第 ${state.recommendationRound} 轮推荐依据</strong><p data-output="recommendation-reason">${roundReason}</p></div>
              <h2 class="section-title">你的偏好反馈</h2>
              <div class="summary-card"><p>增加：${state.preferredStyles.join('、') || '尚未反馈'}<br>减少：${state.reducedStyles.join('、') || '尚未反馈'}</p></div>
            </div>
            <footer class="side-footer"><button class="secondary-button" type="button" data-action="refresh-recommendations">基于偏好再次推荐</button></footer>
          </aside>
          <div class="recommend-main">
            <header class="module-header"><div><h1>多风格纹样推荐</h1><p>不是一次性给出单一答案，而是通过反馈逐轮收敛</p></div><span class="module-badge">第 ${state.recommendationRound} 轮</span></header>
            <div class="recommend-grid">${orderedPatterns.map(pattern => `<article class="pattern-card ${state.selectedPatternIds.includes(pattern.id) ? 'is-selected' : ''}" data-pattern-id="${pattern.id}">
              <div class="pattern-image">${motifSvg(pattern.id)}</div><div class="pattern-copy"><strong>${pattern.title}</strong><p>${pattern.note}</p><span class="style-label">${pattern.style}</span>
              <div class="pattern-actions"><button class="${state.preferredStyles.includes(pattern.style) ? 'is-active' : ''}" type="button" data-action="more-like" data-style="${pattern.style}">更多此类</button><button class="${state.reducedStyles.includes(pattern.style) ? 'is-active' : ''}" type="button" data-action="less-like" data-style="${pattern.style}">减少此类</button><button class="select-pattern ${state.selectedPatternIds.includes(pattern.id) ? 'is-active' : ''}" type="button" data-action="select-pattern" data-pattern-choice="${pattern.id}">${state.selectedPatternIds.includes(pattern.id) ? '已选取' : '选取纹样'}</button></div></div>
            </article>`).join('')}</div>
          </div>
          <aside class="recommend-side right">
            <header class="module-header"><div><h1>已选纹样</h1><p>${state.selectedPatternIds.length} 个视觉母题</p></div></header>
            <div class="recommend-side-content">${state.selectedPatternIds.length ? state.selectedPatternIds.map(id => { const pattern = patternCatalog.find(item => item.id === id); return `<div class="selected-pattern-row">${motifSvg(id)}<div><strong>${pattern?.title || id}</strong><div class="style-label">${pattern?.style || ''}</div></div></div>`; }).join('') : '<div class="summary-card"><p>从中间选取至少一张纹样。确认后可在转化画布中继续生成不同风格变体。</p></div>'}</div>
            <footer class="side-footer"><button class="primary-button" type="button" data-action="confirm-patterns" ${state.selectedPatternIds.length ? '' : 'disabled'}>确认纹样，进入转化画布</button></footer>
          </aside>
        </section>`;
      }

      const variantDefinitions = [
        { id: 'variant-streamline', title: '极简流线 v1', prompt: '强化水平延展，降低线条密度，保留龙首识别。', motif: 'minimal-dragon' },
        { id: 'variant-geometric', title: '几何抽象 v1', prompt: '提取龙鳞与折线节奏，形成模块化几何纹样。', motif: 'geometric-scale' },
        { id: 'variant-cultural', title: '文化强化 v1', prompt: '保留传统龙首与祥云关系，控制局部细节密度。', motif: 'traditional-round-dragon' },
      ];

      function trainCompositionSvg(variantId, placement = state.motifPlacement) {
        const variant = variantDefinitions.find(item => item.id === variantId) || variantDefinitions[0];
        const motifInner = motifSvg(variant.motif).replace(/^<svg[^>]*>|<\/svg>$/g, '');
        const translateX = 24 + Number(placement.x) * 3.6;
        const scale = .34 * Number(placement.scale);
        return `<svg viewBox="0 0 640 230" role="img" aria-label="CR400BF 白模上的纹样放置预览">
          <defs><linearGradient id="metal" x1="0" x2="1"><stop stop-color="#f9fafb"/><stop offset=".5" stop-color="#d9e0e7"/><stop offset="1" stop-color="#ffffff"/></linearGradient><linearGradient id="glass2" x1="0" x2="1"><stop stop-color="#18283b"/><stop offset="1" stop-color="#53677d"/></linearGradient></defs>
          <rect width="640" height="230" fill="#f7f9fc"/><path d="M34 76h424c61 0 105 12 145 53l16 23-17 10H34c-15 0-25-9-25-23V101c0-15 10-25 25-25Z" fill="url(#metal)" stroke="#9aa8b9" stroke-width="2"/>
          <path d="M43 102h407c51 0 90 9 121 29H43Z" fill="#303b49" opacity=".2"/><path d="M56 106h50v18H56Zm63 0h50v18h-50Zm63 0h50v18h-50Zm63 0h50v18h-50Zm63 0h50v18h-50Zm63 0h50v18h-50Zm63 0h32c31 1 60 5 85 15h-117Z" fill="url(#glass2)"/>
          <path d="M170 99h36v62h-36Zm193 0h36v62h-36Z" fill="none" stroke="#718096" stroke-width="2"/><g transform="translate(${translateX} 88) scale(${scale})" opacity=".96">${motifInner}</g>
          <path d="M472 102c38 1 66 8 87 18l-67 1Z" fill="#26384d"/><g fill="#30343b"><circle cx="121" cy="177" r="12"/><circle cx="151" cy="177" r="12"/><circle cx="451" cy="177" r="12"/><circle cx="481" cy="177" r="12"/></g><g stroke="#667789" stroke-width="3"><path d="M95 177h82M425 177h82"/></g>
        </svg>`;
      }

      function renderTransform() {
        const selectedVariant = state.selectedVariantId || 'variant-streamline';
        return `<section class="transform-view" data-view="transform">
          <aside class="canvas-side">
            <header class="module-header"><div><h1>纹样资产</h1><p>源纹样与 AI 转化分支</p></div></header>
            <div class="asset-scroll">
              ${state.selectedPatternIds.map(id => { const pattern = patternCatalog.find(item => item.id === id); return `<article class="asset-card"><div>${motifSvg(id)}</div><strong>${pattern?.title || id}</strong><span>源纹样 · 可拖入画布</span></article>`; }).join('')}
              ${state.generatedVariants.map(item => `<button class="asset-card ${state.selectedVariantId === item.id ? 'is-selected' : ''}" type="button" data-variant-id="${item.id}" data-action="select-variant"><div>${motifSvg(item.motif)}</div><strong>${item.title}</strong><span>${item.prompt}</span></button>`).join('')}
              ${state.generatedVariants.length === 0 ? '<div class="summary-card"><p>点击下方“生成 3 个转化分支”，比较不同提示词对同一纹样的转化结果。</p></div>' : ''}
            </div>
            <footer class="side-footer"><button class="primary-button" type="button" data-action="generate-variants">${state.generatedVariants.length ? '重新生成 3 个分支' : '生成 3 个转化分支'}</button></footer>
          </aside>
          <div class="canvas-main">
            <div class="canvas-toolbar"><button class="tool-button is-active" type="button">选择</button><button class="tool-button" type="button">画笔</button><button class="tool-button" type="button">裁剪</button><button class="tool-button" type="button">上传白模</button><button class="tool-button" type="button">复制</button><button class="tool-button" type="button">删除</button><span style="margin-left:auto;color:var(--muted);font-size:8px">白模：CR400BF 严格侧视 · 100%</span></div>
            <div class="canvas-stage"><div class="train-board" data-region="transform-canvas">${trainCompositionSvg(selectedVariant)}<span class="drag-hint">拖动纹样或使用下方位置控制，建立不同车身视觉状态</span></div></div>
            <div class="transform-controls">
              <div class="prompt-branches">${variantDefinitions.map(item => `<div class="prompt-branch"><strong>${item.title}</strong><p>${item.prompt}</p></div>`).join('')}</div>
              <div class="control-grid"><label class="range-label"><span>水平位置</span><input type="range" min="10" max="90" value="${state.motifPlacement.x}" data-control="motif-x"><output>${state.motifPlacement.x}%</output></label><label class="range-label"><span>纹样尺度</span><input type="range" min="0.5" max="1.6" step="0.05" value="${state.motifPlacement.scale}" data-control="motif-scale"><output>${Number(state.motifPlacement.scale).toFixed(2)}×</output></label></div>
            </div>
          </div>
          <aside class="canvas-side right">
            <header class="module-header"><div><h1>截图资产</h1><p>保存多个可复用状态</p></div><span class="module-badge">${state.captures.length}</span></header>
            <div class="asset-scroll">${state.captures.length ? state.captures.map(capture => `<article class="capture-card" data-capture-id="${capture.id}">${trainCompositionSvg(capture.variantId, capture.placement)}<div class="capture-meta"><strong>${capture.name}</strong><span>位置 ${capture.placement.x}% · ${Number(capture.placement.scale).toFixed(2)}×</span></div></article>`).join('') : '<div class="summary-card"><p>调整纹样变体、位置和大小，然后截取当前白模状态。截图会成为后续节点画布的视觉输入。</p></div>'}</div>
            <footer class="side-footer"><button class="secondary-button" type="button" data-action="capture-state" ${state.generatedVariants.length ? '' : 'disabled'}>截取当前状态</button><button class="primary-button" style="margin-top:7px" type="button" data-action="confirm-captures" ${state.captures.length ? '' : 'disabled'}>使用截图进入方案编排</button></footer>
          </aside>
        </section>`;
      }

      const nodeDefinitions = {
        capture: { title: '纹样视觉状态', icon: '图', note: '选取上一阶段保存的白模截图', color: 'capture' },
        layout: { title: '布局方案', icon: '布', note: '定义纹样与色块在车身区域的组织方式', color: 'layout' },
        palette: { title: '色彩方案', icon: '色', note: '独立色板与 AI 色彩使用建议', color: 'palette' },
        generator: { title: '方案生成', icon: 'AI', note: '汇合三类多模态输入，生成一条可追踪分支', color: 'generator' },
      };
      const layoutCatalog = [
        { id: 'layout-window-band', title: '车窗带水平延展', description: '纹样沿车窗带下缘连续延展，视觉稳定、速度指向明确。', ai: true },
        { id: 'layout-waist-accent', title: '腰线局部点缀', description: '仅在腰线和车头过渡区出现，最大程度保留银白留白。' },
        { id: 'layout-skirt-rhythm', title: '裙板渐进节奏', description: '纹样集中在下车体，以疏密变化形成运动节奏。' },
      ];

      function nodeById(id) {
        return state.explorerNodes.find(node => node.id === id);
      }

      function generatorInputs(generatorId) {
        return ['capture', 'layout', 'palette'].reduce((inputs, type) => {
          const edge = state.explorerEdges.find(item => item.to === generatorId && item.type === type);
          inputs[type] = edge ? nodeById(edge.from) : null;
          return inputs;
        }, {});
      }

      function generatorReady(generatorId) {
        const inputs = generatorInputs(generatorId);
        return Boolean(inputs.capture && inputs.layout && inputs.palette);
      }

      function latestGenerator() {
        return [...state.explorerNodes].reverse().find(node => node.type === 'generator');
      }

      function connectSourceToGenerator(sourceNode, generatorNode) {
        state.explorerEdges = state.explorerEdges.filter(edge => !(edge.to === generatorNode.id && edge.type === sourceNode.type));
        state.explorerEdges.push({
          id: `edge-${sourceNode.type}-${sourceNode.id}-${generatorNode.id}`,
          from: sourceNode.id,
          to: generatorNode.id,
          type: sourceNode.type,
        });
      }

      function addExplorerNode(type) {
        const serial = state.explorerNodes.filter(node => node.type === type).length + 1;
        const sourceRows = { capture: 88, layout: 238, palette: 388 };
        const node = {
          id: `${type}-${serial}`,
          type,
          x: type === 'generator' ? 500 + (serial - 1) * 28 : 74 + (serial - 1) * 24,
          y: type === 'generator' ? 218 + (serial - 1) * 30 : sourceRows[type] + (serial - 1) * 18,
          selectedAssetId: null,
        };
        if (type === 'capture') node.selectedAssetId = state.captures[0]?.id || null;
        if (type === 'layout') {
          if (!state.layoutAssets.length) state.layoutAssets = layoutCatalog.map(item => ({ ...item }));
          node.selectedAssetId = 'layout-window-band';
        }
        if (type === 'palette') {
          const paletteId = `palette-${state.paletteAssets.length + 1}`;
          state.paletteAssets.push({ id: paletteId, title: 'AI 默认文化主题配色', colors: [], excludedColors: [], searched: false, extracted: false, description: '以银白金属色为主体，宫墙朱红用于主要色带，青花蓝作为少量视觉点缀；可继续检索情绪板细化。' });
          node.selectedAssetId = paletteId;
        }
        state.explorerNodes.push(node);
        if (type === 'generator') {
          ['capture', 'layout', 'palette'].forEach(sourceType => {
            const source = [...state.explorerNodes].reverse().find(item => item.type === sourceType);
            if (source) connectSourceToGenerator(source, node);
          });
          state.selectedNodeId = node.id;
        } else {
          const generator = latestGenerator();
          if (generator) {
            connectSourceToGenerator(node, generator);
            state.selectedNodeId = generator.id;
          } else {
            state.selectedNodeId = node.id;
          }
        }
      }

      function nodeSummary(node) {
        if (node.type === 'capture') {
          const capture = state.captures.find(item => item.id === node.selectedAssetId);
          return capture ? `${capture.name} · ${capture.placement.x}% / ${Number(capture.placement.scale).toFixed(2)}×` : '请选择截图资产';
        }
        if (node.type === 'layout') return state.layoutAssets.find(item => item.id === node.selectedAssetId)?.title || '待选择布局';
        if (node.type === 'palette') return state.paletteAssets.find(item => item.id === node.selectedAssetId)?.title || '待生成色板';
        const connected = Object.values(generatorInputs(node.id)).filter(Boolean).length;
        return `${connected}/3 类输入已连接 · ${generatorReady(node.id) ? '可以生成' : '仍需补充输入'}`;
      }

      function renderEdges() {
        return state.explorerEdges.map(edge => {
          const source = nodeById(edge.from);
          const target = nodeById(edge.to);
          if (!source || !target) return '';
          const yOffset = edge.type === 'capture' ? 51 : edge.type === 'layout' ? 72 : 93;
          const x1 = source.x + 190;
          const y1 = source.y + 51;
          const x2 = target.x;
          const y2 = target.y + yOffset;
          const bend = Math.max(55, (x2 - x1) * .5);
          return `<path class="edge-line ${edge.type}" d="M ${x1} ${y1} C ${x1 + bend} ${y1}, ${x2 - bend} ${y2}, ${x2} ${y2}" data-edge-id="${edge.id}" data-edge-type="${edge.type}" aria-label="${edge.type} 数据连接"></path>`;
        }).join('');
      }

      function renderExplorerNode(node) {
        const definition = nodeDefinitions[node.type];
        const ready = node.type === 'generator' && generatorReady(node.id);
        const sourcePort = node.type !== 'generator'
          ? `<button class="node-port output ${definition.color}" type="button" data-port-output="${node.type}" data-node-port-id="${node.id}" aria-label="连接${definition.title}输出"></button>`
          : `<button class="node-port input capture" type="button" data-port-input="capture" data-node-port-id="${node.id}" aria-label="连接纹样视觉状态"></button><button class="node-port input layout" type="button" data-port-input="layout" data-node-port-id="${node.id}" aria-label="连接布局方案"></button><button class="node-port input palette" type="button" data-port-input="palette" data-node-port-id="${node.id}" aria-label="连接色彩方案"></button>`;
        return `<article class="explorer-node ${state.selectedNodeId === node.id ? 'is-selected' : ''}" style="left:${node.x}px;top:${node.y}px" data-node-id="${node.id}" data-node-type="${node.type}" tabindex="0">
          <div class="node-head"><span>${definition.icon}</span><strong>${definition.title} ${node.id.split('-').pop()}</strong></div>
          <p class="node-summary">${nodeSummary(node)}</p>
          <span class="node-status ${ready ? 'is-ready' : ''}">${node.type === 'generator' ? (ready ? '输入完整' : '等待输入') : '视觉输入'}</span>${sourcePort}
        </article>`;
      }

      function createOrUpdateProposal(generatorId) {
        if (!generatorReady(generatorId)) return;
        const inputs = generatorInputs(generatorId);
        const capture = state.captures.find(item => item.id === inputs.capture.selectedAssetId);
        const layout = state.layoutAssets.find(item => item.id === inputs.layout.selectedAssetId) || layoutCatalog[0];
        const palette = state.paletteAssets.find(item => item.id === inputs.palette.selectedAssetId);
        const prompt = `为 CR400BF 高速列车生成中国传统文化主题涂装方案。严格保持车体结构、车窗和车门位置，不改变车型。\n纹样视觉状态：采用${capture?.name || '白模截图'}，纹样水平位置 ${capture?.placement?.x || 54}%，尺度 ${Number(capture?.placement?.scale || 1).toFixed(2)}×。\n布局方案：${layout.title}；${layout.description}\n色彩方案：${palette?.description || '以银白金属色为主体，文化色仅作局部点缀。'}\n设计要求：现代、庄重、具有速度感，避免全车满铺，保留大面积银白金属留白。`;
        const existingIndex = state.proposals.findIndex(item => item.generatorId === generatorId);
        const proposal = {
          id: existingIndex >= 0 ? state.proposals[existingIndex].id : `proposal-${state.proposals.length + 1}`,
          title: `候选方案 ${String.fromCharCode(65 + (existingIndex >= 0 ? existingIndex : state.proposals.length))}`,
          generatorId,
          captureId: inputs.capture.selectedAssetId,
          layoutId: inputs.layout.selectedAssetId,
          paletteId: inputs.palette.selectedAssetId,
          promptImages: [inputs.capture.selectedAssetId, inputs.layout.selectedAssetId, inputs.palette.selectedAssetId],
          prompt,
        };
        if (existingIndex >= 0) state.proposals[existingIndex] = proposal;
        else state.proposals.push(proposal);
      }

      function renderPromptPacket(proposal) {
        const capture = state.captures.find(item => item.id === proposal.captureId);
        const palette = state.paletteAssets.find(item => item.id === proposal.paletteId);
        const colors = palette?.colors?.length ? palette.colors : ['#F4F1EA', '#A72B2A', '#285A9B', '#D5B36B'];
        return `<div class="prompt-packet"><strong>多模态生成包 · 3 图 + 1 文本</strong><div class="prompt-images"><div class="prompt-image" data-prompt-image="capture">${trainCompositionSvg(capture?.variantId, capture?.placement)}</div><div class="prompt-image" data-prompt-image="layout"><div class="layout-mini"><span></span><span></span><span></span></div></div><div class="prompt-image" data-prompt-image="palette"><div class="palette-mini">${colors.slice(0, 4).map(color => `<span style="background:${color}"></span>`).join('')}</div></div></div><div class="composed-prompt" data-output="composed-prompt">${proposal.prompt}</div></div>`;
      }

      function renderInspector() {
        const selectedEdge = state.explorerEdges.find(edge => edge.id === state.selectedEdgeId);
        if (selectedEdge) return `<h2 class="inspector-title">已选择数据连接</h2><div class="edge-selection"><strong>${nodeDefinitions[selectedEdge.type].title} → 方案生成</strong><p>这条连线传递的是${selectedEdge.type === 'capture' ? '白模截图与纹样放置状态' : selectedEdge.type === 'layout' ? '布局参考图及布局说明' : '色板图和色彩使用说明'}。删除后，方案生成将暂时不可执行。</p><button class="danger-button" type="button" data-action="delete-edge">删除此连接</button></div>`;
        const selected = nodeById(state.selectedNodeId) || latestGenerator();
        if (!selected) return '<div class="summary-card"><p>从左侧添加功能节点。系统会把新输入自动连接到当前方案生成节点，仍可手动删除或重连。</p></div>';
        const definition = nodeDefinitions[selected.type];
        if (selected.type === 'capture') return `<h2 class="inspector-title">${definition.title}</h2><div class="inspector-card"><strong>节点职责</strong><p>${definition.note}</p></div><div class="inspector-card"><strong>当前资产</strong><p>${nodeSummary(selected)}</p></div>`;
        if (selected.type === 'layout') return `<h2 class="inspector-title">布局方案</h2><div class="inspector-card"><strong>AI 推荐</strong><p>基于“修长车身、较多留白、水平速度感”，优先推荐车窗带水平延展。布局只定义空间组织，不绑定具体颜色。</p></div><div class="inspector-card"><strong>选择布局</strong>${layoutCatalog.map(layout => `<button class="layout-option ${selected.selectedAssetId === layout.id ? 'is-selected' : ''}" type="button" data-action="choose-layout" data-layout-id="${layout.id}">${layout.ai ? 'AI 推荐 · ' : ''}${layout.title}<br><small>${layout.description}</small></button>`).join('')}</div>`;
        if (selected.type === 'palette') {
          const palette = state.paletteAssets.find(item => item.id === selected.selectedAssetId);
          return `<h2 class="inspector-title">独立色彩节点</h2><div class="inspector-card"><strong>1. 文化主题情绪板</strong><p>以“中国传统文化、宫墙、青花、速度感”为关键词检索；也可用“上传参考图”替代。</p><button class="secondary-button" style="width:100%;margin-top:8px" type="button" data-action="search-moodboard">${palette?.searched ? '重新检索图片' : 'AI 检索文化图片'}</button>${palette?.searched ? `<div class="moodboard-grid"><div class="moodboard-image" data-moodboard-image="宫墙"></div><div class="moodboard-image" data-moodboard-image="青花"></div><div class="moodboard-image" data-moodboard-image="金属列车"></div></div><button class="secondary-button" style="width:100%" type="button" data-action="extract-palette">从情绪板提取色板</button>` : ''}</div>
            ${palette?.extracted ? `<div class="inspector-card"><strong>2. 色板筛选</strong><p>点击 × 排除不进入方案的杂色。</p><div class="swatch-row">${palette.colors.map(color => `<div class="swatch" style="background:${color}" data-color="${color}"><button class="swatch-remove" type="button" data-action="exclude-color" data-color="${color}" aria-label="排除颜色 ${color}">×</button><small>${color}</small></div>`).join('')}</div><div style="height:12px"></div></div><div class="inspector-card"><strong>3. AI 色彩使用建议</strong><p>${palette.description}</p><button class="secondary-button" style="width:100%;margin-top:8px" type="button" data-action="accept-color-guidance">采用此用色建议</button></div>` : ''}`;
        }
        const inputs = generatorInputs(selected.id);
        const proposal = state.proposals.find(item => item.generatorId === selected.id);
        return `<h2 class="inspector-title">方案生成分支</h2>
          <div class="inspector-card"><strong>必要输入检查</strong>${['capture', 'layout', 'palette'].map(type => `<div class="input-check"><span>${nodeDefinitions[type].title}</span><b class="${inputs[type] ? '' : 'missing'}">${inputs[type] ? '已连接' : '缺失'}</b></div>`).join('')}</div>
          <div class="inspector-card"><strong>连接的含义</strong><p>箭头表示上一节点的结构化输出被当前生成分支引用。紫色传截图、橙色传布局、绿色传色板和色彩描述。</p></div>
          <div class="button-stack"><button class="primary-button" style="width:100%" type="button" data-action="generate-proposal" ${generatorReady(selected.id) ? '' : 'disabled'}>${proposal ? '重新生成当前方案' : '生成当前组合方案'}</button><button class="secondary-button" style="width:100%" type="button" data-action="duplicate-generator" ${generatorReady(selected.id) ? '' : 'disabled'}>复制为新探索分支</button></div>${proposal ? renderPromptPacket(proposal) : ''}`;
      }

      function renderCompose() {
        return `<section class="compose-view" data-view="compose">
          <aside class="node-side" data-region="function-library"><header class="module-header"><div><h1>功能节点</h1><p>只保留方案组合所需输入</p></div></header><div class="library-scroll">
            <div class="library-note">点击添加后系统自动连到当前生成节点；连线只是数据引用，不会改变源资产。节点可继续复制、重连并形成并行分支。</div>
            ${Object.entries(nodeDefinitions).map(([type, item]) => `<button class="node-tool" type="button" data-add-node="${type}"><span class="node-tool-icon">${item.icon}</span><span><strong>${item.title}</strong><span>${item.note}</span></span><b>＋</b></button>`).join('')}
          </div><footer class="side-footer"><div class="summary-card"><p>当前：${state.explorerNodes.length} 个节点 · ${state.explorerEdges.length} 条数据连接</p></div></footer></aside>
          <div class="node-workbench"><div class="node-toolbar"><p><strong>方案组合画布</strong> · 搭积木式探索 capture + layout + palette → proposal</p>${state.pendingConnection ? `<span class="connection-hint">正在连接 ${nodeDefinitions[state.pendingConnection.type].title}，请选择同类型输入端口</span>` : ''}<span style="margin-left:auto"></span><button class="tool-button" type="button">适配视图</button><button class="tool-button" type="button">整理节点</button></div><div class="node-canvas" data-region="node-canvas"><svg class="edge-layer" aria-label="节点数据连接">${renderEdges()}</svg>${state.explorerNodes.map(renderExplorerNode).join('')} ${state.explorerNodes.length ? '' : '<div class="summary-card" style="position:absolute;left:50%;top:42%;width:310px;transform:translate(-50%,-50%);text-align:center"><strong>从“方案生成”节点开始</strong><p>然后添加截图、布局和色彩节点，系统会自动建立三种类型明确的连接。</p></div>'}</div></div>
          <aside class="node-side right"><header class="module-header"><div><h1>节点检查器</h1><p>配置资产、查看输入与生成</p></div></header><div class="inspector-scroll">${renderInspector()}</div><footer class="side-footer"><button class="secondary-button" type="button" style="width:100%">保存当前探索路径</button></footer></aside>
        </section>`;
      }

      function proposalVisualSvg(proposal, sceneId = 'studio') {
        const primary = proposal.paletteId?.endsWith('-2') ? '#285A9B' : '#A72B2A';
        const accent = proposal.paletteId?.endsWith('-2') ? '#D5B36B' : '#285A9B';
        const scene = sceneId === 'motion'
          ? `<defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#b9d5ea"/><stop offset="1" stop-color="#eef4f6"/></linearGradient></defs><rect width="640" height="260" fill="url(#sky)"/><g stroke="#fff" stroke-width="4" opacity=".8"><path d="M0 42h180M35 67h225M0 92h140"/></g><path d="M0 190h640v70H0Z" fill="#657483"/><path d="M0 206h640" stroke="#e8edf0" stroke-width="4"/>`
          : sceneId === 'platform'
            ? `<defs><linearGradient id="station" x2="0" y2="1"><stop stop-color="#dce7ef"/><stop offset="1" stop-color="#f7f8f8"/></linearGradient></defs><rect width="640" height="260" fill="url(#station)"/><path d="M0 54h640M0 54l78 70M150 54l-60 70M270 54l-55 70M390 54l-45 70M510 54l-35 70M630 54l-28 70" stroke="#718398" stroke-width="7" opacity=".55"/><path d="M0 198h640v62H0Z" fill="#a8b0b6"/><path d="M0 208h640" stroke="#f0cf43" stroke-width="5"/>`
            : sceneId === 'detail'
              ? `<rect width="640" height="260" fill="#edf0f3"/><circle cx="510" cy="60" r="110" fill="#d9e0e5"/><path d="M0 210h640v50H0Z" fill="#c8d0d7"/>`
              : `<defs><linearGradient id="studio" x2="0" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#dfe6ed"/></linearGradient></defs><rect width="640" height="260" fill="url(#studio)"/><ellipse cx="330" cy="206" rx="280" ry="22" fill="#718096" opacity=".18"/>`;
        const layoutGraphic = proposal.layoutId === 'layout-waist-accent'
          ? `<path d="M78 148c122-2 194-1 272 0 65 2 116-4 163-20" fill="none" stroke="${primary}" stroke-width="10"/><path d="M390 149c47-2 89-9 123-21" fill="none" stroke="${accent}" stroke-width="3"/>`
          : proposal.layoutId === 'layout-skirt-rhythm'
            ? `<path d="M68 172h96l27-16 29 16h94l31-20 31 20h110" fill="none" stroke="${primary}" stroke-width="9" stroke-linejoin="round"/>`
            : `<path d="M62 135h435c30 0 55-7 76-18" fill="none" stroke="${primary}" stroke-width="9"/><path d="M360 147h168" stroke="${accent}" stroke-width="4"/>`;
        return `<svg viewBox="0 0 640 260" role="img" aria-label="${proposal.title} ${sceneId} 场景预览">${scene}<g transform="translate(0 ${sceneId === 'studio' ? 2 : 22})"><path d="M48 89h405c62 0 108 12 150 54l15 19-17 9H48c-18 0-30-10-30-26v-28c0-18 12-28 30-28Z" fill="#f2f4f5" stroke="#8493a5" stroke-width="2"/><path d="M57 111h398c53 0 92 9 123 29H57Z" fill="#26384d" opacity=".15"/><g fill="#26384d"><path d="M72 113h48v17H72Zm61 0h48v17h-48Zm61 0h48v17h-48Zm61 0h48v17h-48Zm61 0h48v17h-48Zm61 0h48v17h-48Zm61 0h44c26 1 52 5 78 14H438Z"/></g>${layoutGraphic}<g fill="#30343b"><circle cx="134" cy="181" r="11"/><circle cx="164" cy="181" r="11"/><circle cx="455" cy="181" r="11"/><circle cx="485" cy="181" r="11"/></g></g></svg>`;
      }

      function renderSelect() {
        return `<section class="select-view" data-view="select"><header class="select-header"><div><h1>候选方案评价与人工选择</h1><p>AI 提供多维解释，最终保留哪些分支由设计者决定</p></div><span class="selection-count">已选 ${state.selectedProposalIds.length} / 最多 4 个</span></header><div class="select-content"><div class="proposal-grid">${state.proposals.map((proposal, index) => {
          const layout = state.layoutAssets.find(item => item.id === proposal.layoutId);
          const selected = state.selectedProposalIds.includes(proposal.id);
          return `<article class="proposal-card ${selected ? 'is-selected' : ''}" data-proposal-id="${proposal.id}"><div class="proposal-preview">${proposalVisualSvg(proposal)}</div><div class="proposal-info"><div class="proposal-title-row"><strong>${proposal.title}</strong>${index < 2 ? '<span class="recommended-tag">AI 建议保留</span>' : ''}</div><p class="proposal-route">${layout?.title || '布局方案'} · ${proposal.paletteId} · 路径可回溯至 ${proposal.generatorId}</p><div class="score-row"><div class="score-cell"><b>${92 - index * 3}</b><span>车体适配</span></div><div class="score-cell"><b>${88 + index}</b><span>文化一致</span></div><div class="score-cell"><b>100</b><span>可追溯</span></div></div><button class="select-button" type="button" data-action="toggle-proposal">${selected ? '已保留 · 点击取消' : '人工选择此方案'}</button></div></article>`;
        }).join('')}</div><aside class="ai-evaluation"><h2>AI 评价建议</h2><div class="evaluation-card" data-ai-recommendation><strong>建议保留 A 与 B</strong><p>A 的水平延展与车体比例匹配度最高；B 的局部点缀留白更充分。二者可代表“连续色带”和“局部强调”两条不同深化路径。</p></div><div class="evaluation-card"><strong>为什么不直接替你决定</strong><p>评分只用于辅助比较。文化表达的恰当性、品牌气质与最终审美判断仍由设计者掌握。</p></div><div class="evaluation-card"><strong>当前探索覆盖</strong><p>${state.proposals.length} 条生成路径，${new Set(state.proposals.map(item => item.layoutId)).size} 类布局，${new Set(state.proposals.map(item => item.paletteId)).size} 套色彩输入。</p></div></aside></div><footer class="select-footer"><button class="secondary-button" type="button" data-stage-id="compose">返回调整节点</button><button class="primary-button" type="button" data-action="confirm-proposals" ${state.selectedProposalIds.length ? '' : 'disabled'}>确认选择，进入高保真深化</button></footer></section>`;
      }

      const sceneCatalog = [
        { id: 'platform', title: '站台到站场景', note: '验证真实站台尺度与辨识度' },
        { id: 'motion', title: '高速运动场景', note: '验证远距离速度感与色带连续性' },
        { id: 'studio', title: '侧视展示场景', note: '用于完整审查车身布局和比例' },
        { id: 'detail', title: '车头细节场景', note: '深化纹样转折和局部材质' },
      ];

      function renderFidelity() {
        return `<section class="fidelity-view" data-view="fidelity"><header class="fidelity-header"><div><h1>高保真场景深化</h1><p>将人工选定的方案与真实展示场景交叉生成，形成最终设计资产</p></div><span class="selection-count">${state.selectedProposalIds.length} 个方案 · ${state.selectedSceneIds.length} 个场景</span></header><div class="fidelity-content"><aside class="scene-panel"><div class="scene-scroll"><h2>选择输出场景</h2><p>可多选。每个方案会分别生成对应场景，保留方案—场景映射。</p>${sceneCatalog.map(scene => `<button class="scene-option ${state.selectedSceneIds.includes(scene.id) ? 'is-selected' : ''}" type="button" data-scene-id="${scene.id}" aria-pressed="${state.selectedSceneIds.includes(scene.id)}"><span class="scene-thumb"></span><span><strong>${scene.title}</strong><span>${scene.note}</span></span></button>`).join('')}</div><footer class="side-footer"><button class="primary-button" style="width:100%" type="button" data-action="generate-fidelity" ${state.selectedSceneIds.length ? '' : 'disabled'}>生成 ${state.selectedProposalIds.length * state.selectedSceneIds.length} 张高保真效果</button></footer></aside><div class="output-area">${state.highFidelityOutputs.length ? `<div class="output-grid">${state.highFidelityOutputs.map(output => { const proposal = state.proposals.find(item => item.id === output.proposalId); const scene = sceneCatalog.find(item => item.id === output.sceneId); return `<article class="output-card" data-fidelity-output="${output.id}"><div class="output-visual">${proposalVisualSvg(proposal, output.sceneId)}</div><div class="output-meta"><strong>${proposal.title} · ${scene.title}</strong><span>4K 深化模拟 · 路径已归档</span></div></article>`; }).join('')}</div>` : '<div class="output-empty"><strong>等待生成高保真场景</strong><p>在左侧选择站台、运动、侧视或细节场景。系统会把已选方案及其完整多模态输入继续传入深化模型。</p></div>'}</div></div></section>`;
      }

      function renderModal() {
        const layer = document.querySelector('[data-region="modal-layer"]');
        layer.innerHTML = state.archiveOpen ? `<div class="modal-backdrop"><section class="archive-drawer" data-region="process-archive" role="dialog" aria-modal="true" aria-label="共创过程档案"><header class="module-header"><div><h1>共创过程档案</h1><p>从需求到最终场景的可追溯记录</p></div><button class="top-action" type="button" data-action="close-archive">关闭</button></header><div class="archive-body"><div class="archive-step"><strong>需求与文化意向</strong><p>${state.intentions.join('、')} · CR400BF · 现代、庄重、速度感</p></div><div class="archive-step"><strong>纹样推荐与偏好反馈</strong><p>第 ${state.recommendationRound} 轮 · 已选 ${state.selectedPatternIds.length} 个源纹样</p></div><div class="archive-step"><strong>纹样转化与白模截图</strong><p>${state.generatedVariants.length} 条转化分支 · ${state.captures.length} 个视觉状态</p></div><div class="archive-step"><strong>方案组合探索</strong><p>${state.explorerNodes.length} 个节点 · ${state.explorerEdges.length} 条类型化连接 · ${state.proposals.length} 个候选方案</p></div><div class="archive-step"><strong>人工选择与深化</strong><p>人工保留 ${state.selectedProposalIds.length} 个方案 · 输出 ${state.highFidelityOutputs.length} 张场景效果</p></div></div></section></div>` : '';
      }

      function renderWorkspace() {
        const region = document.querySelector('[data-region="main-workspace"]');
        region.innerHTML = state.activeStage === 'demand'
          ? renderDemand()
          : state.activeStage === 'recommend'
            ? renderRecommendation()
            : state.activeStage === 'transform'
              ? renderTransform()
              : state.activeStage === 'compose'
                ? renderCompose()
                : state.activeStage === 'select'
                  ? renderSelect()
                  : state.activeStage === 'fidelity'
                    ? renderFidelity()
            : `<section class="placeholder-view" data-view="${state.activeStage}"><p>${stages.find(stage => stage.id === state.activeStage)?.label}</p></section>`;
      }

      function renderAll() {
        renderStageNav();
        renderWorkspace();
        renderModal();
      }

      function resetDemo() {
        state = clone(INITIAL_STATE);
        renderAll();
      }

      document.addEventListener('click', (event) => {
        const target = event.target.closest('button');
        if (!target) {
          const edge = event.target.closest('[data-edge-id]');
          if (edge) {
            state.selectedEdgeId = edge.dataset.edgeId;
            state.selectedNodeId = null;
            renderWorkspace();
            return;
          }
          const node = event.target.closest('[data-node-id]');
          if (node) {
            state.selectedNodeId = node.dataset.nodeId;
            state.selectedEdgeId = null;
            renderWorkspace();
          }
          return;
        }
        if (target.dataset.portOutput) {
          state.pendingConnection = { nodeId: target.dataset.nodePortId, type: target.dataset.portOutput };
          state.selectedEdgeId = null;
          renderWorkspace();
          return;
        }
        if (target.dataset.portInput) {
          if (state.pendingConnection && state.pendingConnection.type === target.dataset.portInput) {
            const source = nodeById(state.pendingConnection.nodeId);
            const generator = nodeById(target.dataset.nodePortId);
            if (source && generator?.type === 'generator') connectSourceToGenerator(source, generator);
            state.pendingConnection = null;
            state.selectedNodeId = generator?.id || null;
            state.selectedEdgeId = null;
            renderAll();
          }
          return;
        }
        if (target.dataset.stageId && canOpenStage(target.dataset.stageId)) {
          state.activeStage = target.dataset.stageId;
          renderAll();
        }
        if (target.dataset.intent) {
          const value = target.dataset.intent;
          state.intentions = state.intentions.includes(value)
            ? state.intentions.filter((item) => item !== value)
            : [...state.intentions, value];
          renderWorkspace();
        }
        if (target.dataset.action === 'confirm-demand') {
          state.demandConfirmed = true;
          state.activeStage = 'recommend';
          renderAll();
        }
        if (target.dataset.action === 'more-like') {
          const style = target.dataset.style;
          if (!state.preferredStyles.includes(style)) state.preferredStyles.push(style);
          state.reducedStyles = state.reducedStyles.filter(item => item !== style);
          renderWorkspace();
        }
        if (target.dataset.action === 'less-like') {
          const style = target.dataset.style;
          if (!state.reducedStyles.includes(style)) state.reducedStyles.push(style);
          state.preferredStyles = state.preferredStyles.filter(item => item !== style);
          renderWorkspace();
        }
        if (target.dataset.action === 'refresh-recommendations') {
          state.recommendationRound = 2;
          renderWorkspace();
        }
        if (target.dataset.action === 'select-pattern') {
          const patternId = target.dataset.patternChoice;
          state.selectedPatternIds = state.selectedPatternIds.includes(patternId)
            ? state.selectedPatternIds.filter(id => id !== patternId)
            : [...state.selectedPatternIds, patternId];
          renderAll();
        }
        if (target.dataset.action === 'confirm-patterns' && state.selectedPatternIds.length) {
          state.activeStage = 'transform';
          renderAll();
        }
        if (target.dataset.action === 'generate-variants') {
          state.generatedVariants = variantDefinitions.map(item => ({ ...item }));
          state.selectedVariantId = variantDefinitions[0].id;
          renderAll();
        }
        if (target.dataset.action === 'select-variant') {
          state.selectedVariantId = target.dataset.variantId;
          renderWorkspace();
        }
        if (target.dataset.action === 'capture-state' && state.generatedVariants.length) {
          state.captures.push({
            id: `capture-${state.captures.length + 1}`,
            name: `截图 ${state.captures.length + 1}`,
            variantId: state.selectedVariantId,
            placement: { ...state.motifPlacement },
          });
          renderAll();
        }
        if (target.dataset.action === 'confirm-captures' && state.captures.length) {
          state.activeStage = 'compose';
          renderAll();
        }
        if (target.dataset.addNode) {
          addExplorerNode(target.dataset.addNode);
          renderAll();
        }
        if (target.dataset.action === 'delete-edge' && state.selectedEdgeId) {
          state.explorerEdges = state.explorerEdges.filter(edge => edge.id !== state.selectedEdgeId);
          const generator = latestGenerator();
          state.selectedEdgeId = null;
          state.selectedNodeId = generator?.id || null;
          renderAll();
        }
        if (target.dataset.action === 'choose-layout') {
          const node = nodeById(state.selectedNodeId);
          if (node?.type === 'layout') node.selectedAssetId = target.dataset.layoutId;
          renderAll();
        }
        if (target.dataset.action === 'search-moodboard') {
          const node = nodeById(state.selectedNodeId);
          const palette = state.paletteAssets.find(item => item.id === node?.selectedAssetId);
          if (palette) palette.searched = true;
          renderWorkspace();
        }
        if (target.dataset.action === 'extract-palette') {
          const node = nodeById(state.selectedNodeId);
          const palette = state.paletteAssets.find(item => item.id === node?.selectedAssetId);
          if (palette) {
            palette.extracted = true;
            palette.title = '宫墙朱红与青花蓝';
            palette.colors = ['#F4F1EA', '#A72B2A', '#285A9B', '#D5B36B', '#30343B'];
            palette.description = '建议从提取颜色中筛除杂色，再生成面向车身区域的用色说明。';
          }
          renderAll();
        }
        if (target.dataset.action === 'exclude-color') {
          const node = nodeById(state.selectedNodeId);
          const palette = state.paletteAssets.find(item => item.id === node?.selectedAssetId);
          if (palette) {
            palette.colors = palette.colors.filter(color => color !== target.dataset.color);
            palette.excludedColors = [...new Set([...(palette.excludedColors || []), target.dataset.color])];
          }
          renderWorkspace();
        }
        if (target.dataset.action === 'accept-color-guidance') {
          const node = nodeById(state.selectedNodeId);
          const palette = state.paletteAssets.find(item => item.id === node?.selectedAssetId);
          if (palette) palette.description = '以银白金属色为车身主体（约 70%），宫墙朱红用于腰线与主要色块（约 22%），青花蓝仅作车头和纹样细节的点缀色（约 8%）；不使用黑灰杂色。';
          renderAll();
        }
        if (target.dataset.action === 'generate-proposal') {
          const generator = nodeById(state.selectedNodeId);
          if (generator?.type === 'generator' && generatorReady(generator.id)) createOrUpdateProposal(generator.id);
          renderAll();
        }
        if (target.dataset.action === 'duplicate-generator') {
          const generator = nodeById(state.selectedNodeId);
          if (generator?.type === 'generator' && generatorReady(generator.id)) addExplorerNode('generator');
          renderAll();
        }
        if (target.dataset.action === 'toggle-proposal') {
          const proposal = target.closest('[data-proposal-id]');
          const proposalId = proposal?.dataset.proposalId;
          if (proposalId) {
            state.selectedProposalIds = state.selectedProposalIds.includes(proposalId)
              ? state.selectedProposalIds.filter(id => id !== proposalId)
              : state.selectedProposalIds.length < 4 ? [...state.selectedProposalIds, proposalId] : state.selectedProposalIds;
          }
          renderAll();
        }
        if (target.dataset.action === 'confirm-proposals' && state.selectedProposalIds.length) {
          state.activeStage = 'fidelity';
          renderAll();
        }
        if (target.dataset.sceneId) {
          const sceneId = target.dataset.sceneId;
          state.selectedSceneIds = state.selectedSceneIds.includes(sceneId)
            ? state.selectedSceneIds.filter(id => id !== sceneId)
            : [...state.selectedSceneIds, sceneId];
          renderAll();
        }
        if (target.dataset.action === 'generate-fidelity' && state.selectedSceneIds.length) {
          state.highFidelityOutputs = state.selectedProposalIds.flatMap(proposalId => state.selectedSceneIds.map(sceneId => ({ id: `output-${proposalId}-${sceneId}`, proposalId, sceneId })));
          renderAll();
        }
        if (target.dataset.action === 'open-archive') {
          state.archiveOpen = true;
          renderAll();
        }
        if (target.dataset.action === 'close-archive') {
          state.archiveOpen = false;
          renderAll();
        }
        if (target.dataset.action === 'reset-demo') resetDemo();
      });

      document.addEventListener('input', (event) => {
        const target = event.target;
        if (target?.dataset?.control === 'motif-x') {
          state.motifPlacement.x = Number(target.value);
          renderWorkspace();
        }
        if (target?.dataset?.control === 'motif-scale') {
          state.motifPlacement.scale = Number(target.value);
          renderWorkspace();
        }
      });

      document.addEventListener('pointerdown', (event) => {
        if (event.target.closest('[data-region="transform-canvas"]')) draggingMotif = true;
        const node = event.target.closest('[data-node-id]');
        const canvas = event.target.closest('[data-region="node-canvas"]');
        if (node && canvas && !event.target.closest('.node-port')) {
          const current = nodeById(node.dataset.nodeId);
          if (current) draggingNode = { id: current.id, startX: event.clientX, startY: event.clientY, x: current.x, y: current.y };
        }
      });
      document.addEventListener('pointermove', (event) => {
        if (draggingNode) {
          const node = nodeById(draggingNode.id);
          if (!node) return;
          node.x = Math.max(12, draggingNode.x + event.clientX - draggingNode.startX);
          node.y = Math.max(12, draggingNode.y + event.clientY - draggingNode.startY);
          renderWorkspace();
          return;
        }
        if (!draggingMotif) return;
        const board = document.querySelector('[data-region="transform-canvas"]');
        if (!board) return;
        const rect = board.getBoundingClientRect();
        if (!rect.width) return;
        state.motifPlacement.x = Math.round(Math.max(10, Math.min(90, ((event.clientX - rect.left) / rect.width) * 100)));
        renderWorkspace();
      });
      document.addEventListener('pointerup', () => { draggingMotif = false; draggingNode = null; });
      document.addEventListener('keydown', (event) => {
        if (event.key !== 'Escape') return;
        if (state.archiveOpen || state.pendingConnection) {
          state.archiveOpen = false;
          state.pendingConnection = null;
          renderAll();
        }
      });

      window.prototypeApi = { getState: () => clone(state), reset: resetDemo };
      renderAll();
    })();
  </script>
</body>
</html>
